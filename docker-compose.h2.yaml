volumes:
  data-db:
services:
  app:
    container_name: 'spring-eureka'
    restart: unless-stopped
    build:
      dockerfile: ./Dockerfile
      context: ./
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - data-db:/app/data
    environment:
      JAVA_VM_OPTIONS: "-Xmx512m -Xms256m"